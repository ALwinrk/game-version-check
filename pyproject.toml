[project]
name = "game-version-checker"
version = "5.0.0"
description = "游戏版本自动排查工具 — 自动查询 Google Play + APK 站，比对版本变化"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "google-play-scraper>=1.2",
    "curl_cffi>=0.6",
    "openpyxl>=3.1",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
gui = [
    "customtkinter>=5.2",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
gvc = "gvc.cli:main"
gvc-gui = "gvc_gui.app:main"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
